<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPP a DOM</title>
</head>
<body>
    
    <h1>OPP a DOM</h1>
    <p id="demo">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate.</p>
    <button onclick="myFunction()">Try it</button>

    <script>
        function myFunction() {
            document.getElementById("demo").innerHTML = "Paragraph changed.";
        }
    </script>

</body>
</html>
