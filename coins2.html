<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Uhádni číslo</title>
</head>
<script>
    let tajneCislo = Math.floor(Math.random() * 10) + 1;
    let zostavajucePokusy = 3;

    document.getElementById("pokusy").textContent =
        "Zostávajúce pokusy: " + zostavajucePokusy;

    function skontroluj() {
        let tip = Number(document.getElementById("tip").value);

        if (zostavajucePokusy === 0) {
            document.getElementById("sprava").textContent =
                "Hra skončila! Číslo bolo " + tajneCislo;
            return;
        }

        if (tip < 1 || tip > 10) {
            document.getElementById("sprava").textContent =
                "Zadaj číslo od 1 do 10!";
            return;
        }

        zostavajucePokusy--;

        if (tip === tajneCislo) {
            document.getElementById("sprava").textContent =
                "Vyhral si!";
            return;
        } else if (tip < tajneCislo) {
            document.getElementById("sprava").textContent =
                "číslo je väčšie.";
        } else {
            document.getElementById("sprava").textContent =
                "číslo je menšie.";
        }

        document.getElementById("pokusy").textContent =
            "Zostávajúce pokusy: " + zostavajucePokusy;

        if (zostavajucePokusy === 0) {
            document.getElementById("sprava").textContent +=
                "Prehral si! Číslo bolo " + tajneCislo;
        }
    }
</script>
<body>

<h2>Uhádni číslo od 1 do 10</h2>

<input type="number" id="tip" min="1" max="10">
<button onclick="skontroluj()">Skontroluj</button>

<p id="sprava"></p>
<p id="pokusy"></p>



</body>
</html>
