<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>

<div class="calc">
    <h2>Calculator</h2>

    <div class="rslt">
        <h1 id="display"></h1>
    </div>
    
    <div class="butns">
        <div>
            <button class="btn" style="background-color: #CEE5F4;">7</button>
            <button class="btn" style="background-color: #CEE5F4;">8</button>
            <button class="btn" style="background-color: #CEE5F4;">9</button>
            <button class="btn" style="background-color: #CEE5F4;">*</button>
        </div>

        <div>
            <button class="btn" style="background-color: #CEE5F4;">4</button>
            <button class="btn" style="background-color: #CEE5F4;">5</button>
            <button class="btn" style="background-color: #CEE5F4;">6</button>
            <button class="btn" style="background-color: #CEE5F4;">/</button>
        </div>

        <div>
            <button class="btn" style="background-color: #CEE5F4;">1</button>
            <button class="btn" style="background-color: #CEE5F4;">2</button>
            <button class="btn" style="background-color: #CEE5F4;">3</button>
            <button class="btn" style="background-color: #CEE5F4;">-</button>
        </div>

        <div>
            <button class="btn" style="background-color: #CEE5F4;">C</button>
            <button class="btn" style="background-color: #CEE5F4;">0</button>
            <button class="btn" style="background-color: #CEE5F4;">=</button>
            <button class="btn" style="background-color: #CEE5F4;">+</button>
        </div>

    </div>
</div>

<div class="history">
    <h3 style="color: white; text-align: center;">History</h3>
    <p class="history-list" ></p>
</div>

<script src="kalk.js"></script>


</body>
<style>
    body{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }
    .calc{
        background-color: #BBD3EF;
        width: 250px;
        height: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        border-radius: 10px;
        box-shadow: 10px 10px 10px rgba(10, 10, 10, 0.1);
        
    }
    .btn{
        width: 50px;
        height: 50px;
        font-size: 20px;
        margin: 2px;
        border: 1px #BBD3EF solid;
        border-radius: 5px;
        transition-duration: 0.4s;

    }
    .butns{
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
    }
    button:hover{
        color: white;
        background-color: #BBD3EF;
    }
    .rslt{
        background-color: #081728;
        width: 220px;
        height: 60px;
        color: white;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding-right: 10px;
        border-radius: 5px;
        box-shadow: 0px 10px 10px rgba(10, 10, 10, 0.1);
    }
    .history{
        right: 120px;
        width: 200px;
        height: 300px;
        background-color: #455a70;
        border-radius: 10px;
        box-shadow: 10px 10px 10px rgba(10, 10, 10, 0.1);
        margin-left: 20px;   
    }
    p.history-list{
        color: white;
        padding: 10px;
        font-size: 18px;
    }
</style>
</html>
